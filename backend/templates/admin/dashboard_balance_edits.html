{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  .dash-cards { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0 20px; }
  .dash-card { flex:1 1 180px; background:var(--body-bg,#fff); border:1px solid var(--hairline-color,#e0e0e0);
               border-radius:8px; padding:12px 14px; }
  .dash-card .label { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--body-quiet-color,#666); }
  .dash-card .value { font-size:22px; font-weight:700; margin-top:4px; }
  .dash-card .sub { font-size:11px; color:var(--body-quiet-color,#888); margin-top:2px; }
  table.dash { width:100%; border-collapse:collapse; font-size:12px; }
  table.dash th, table.dash td { padding:5px 8px; border-bottom:1px solid var(--hairline-color,#eee); text-align:left; white-space:nowrap; }
  table.dash th { background:var(--darkened-bg,#f6f6f6); position:sticky; top:0; }
  .scroll { max-height:460px; overflow:auto; border:1px solid var(--hairline-color,#e0e0e0); border-radius:8px; }
  h2.dash { margin:18px 0 8px; }
  .muted { color:var(--body-quiet-color,#888); }
  .pos { color:#16a34a; } .neg { color:#dc2626; }
  .chip { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; background:#f6ecd0; color:#7a5608; }
  .live-bar { display:flex; align-items:center; gap:8px; margin:6px 0 2px; font-size:12px; color:var(--body-quiet-color,#666); }
  .pulse { width:9px; height:9px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 0 rgba(34,197,94,.7); animation:pulse 1.6s infinite; }
  .pulse.paused { background:#94a3b8; animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.6);} 70%{box-shadow:0 0 0 8px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }
  #dash-live { transition:opacity .2s; }
  #dash-live.loading { opacity:.6; }
</style>
{% endblock %}

{% block breadcrumbs %}
<div class="breadcrumbs">
  <a href="{% url 'admin:index' %}">Home</a> &rsaquo; Balance Edits
</div>
{% endblock %}

{% block content %}
<div id="content-main">
  <div class="live-bar">
    <span class="pulse" id="live-dot"></span>
    <span id="live-status">Live &middot; updating every 5s</span>
  </div>
  <div id="dash-live">
    {% include "admin/_balance_edits_body.html" %}
  </div>
</div>
<script>
(function () {
  var INTERVAL = 5000;
  var el = document.getElementById("dash-live");
  var dot = document.getElementById("live-dot");
  var status = document.getElementById("live-status");
  var timer = null;
  function stamp() { return new Date().toLocaleTimeString(); }
  function refresh() {
    if (document.hidden) return;
    el.classList.add("loading");
    fetch(window.location.pathname + "?partial=1", {
      headers: { "X-Requested-With": "XMLHttpRequest" },
      credentials: "same-origin",
      cache: "no-store"
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        el.innerHTML = html;
        el.classList.remove("loading");
        dot.classList.remove("paused");
        status.textContent = "Live \u00b7 updated " + stamp();
      })
      .catch(function () {
        el.classList.remove("loading");
        dot.classList.add("paused");
        status.textContent = "Reconnecting\u2026";
      });
  }
  function start() { if (!timer) timer = setInterval(refresh, INTERVAL); }
  function stop() { clearInterval(timer); timer = null; }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stop(); dot.classList.add("paused"); status.textContent = "Paused (tab hidden)"; }
    else { dot.classList.remove("paused"); start(); refresh(); }
  });
  start();
})();
</script>
{% endblock %}
