# ---------------------------------------------------------------
# Miyar Trading — nginx for the static frontend + /api proxy
# ---------------------------------------------------------------

# Preserve the protocol seen by the outer proxy
map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name myxtrading.org www.myxtrading.org api.myxtrading.org _;
    return 301 https://$host$request_uri;
}

# API server block for api.myxtrading.org (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name api.myxtrading.org;

    ssl_certificate /etc/letsencrypt/live/myxtrading.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myxtrading.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 15m;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        access_log off;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Main site for myxtrading.org and www.myxtrading.org (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name myxtrading.org www.myxtrading.org;

    ssl_certificate /etc/letsencrypt/live/myxtrading.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myxtrading.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 15m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://assets.coingecko.com https://*.coingecko.com https://api.myxtrading.org https://api.qrserver.com https://queue.simpleanalyticscdn.com; font-src 'self' data:; connect-src 'self' https://api.coingecko.com https://api.myxtrading.org https://queue.simpleanalyticscdn.com wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        access_log off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }
}
