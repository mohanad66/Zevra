# ---------------------------------------------------------------
# Miyar Trading — nginx for the static frontend + /api proxy
# ---------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 15m;

    # --- Gzip ----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers -----------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets.coingecko.com https://*.coingecko.com; font-src 'self' data:; connect-src 'self' https://api.coingecko.com wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- API reverse proxy (Django/gunicorn, service "api") -------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # --- Static / media (shared volumes populated by the API) -----
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- SPA fallback ---------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- Service worker / manifest (always fresh) -------------------
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }
}