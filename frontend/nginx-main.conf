# ---------------------------------------------------------------------------
# Miyar Trading — nginx main config for the frontend container
#
# Replaces the stock /etc/nginx/nginx.conf so the static server + /api reverse
# proxy can absorb a large number of simultaneous connections. The per-vhost
# settings live in conf.d/default.conf (copied from nginx.conf).
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens   off;

    # Cache open static files on disk so repeat hits skip the filesystem.
    open_file_cache          max=10000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
