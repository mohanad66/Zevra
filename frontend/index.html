  <!-- Primary SEO -->
  <title>MYX Trading — Invest in Stablecoins & Earn Referral Rewards</title>
  <meta name="description"
    content="MYX Trading is a secure platform to invest in stablecoins (USDT), track live crypto market prices, and earn three-level referral rewards — on web, Android and iOS." />

    content="MYX Trading, MYX app, myxtrading, MYX trading, stablecoin investment, USDT investment, invest in crypto, crypto referral rewards, three level referral, live crypto prices" />

  <meta name="theme-color" content="#060504" />
  <meta name="color-scheme" content="dark light" />
  <!-- canonical is set at runtime (Seo.jsx) until a public domain is chosen -->

  <!-- Set the theme before first paint so there is no light/dark flash -->
  <script>
    (function () {
      function readCookie(name) {
        var match = document.cookie.match(
          new RegExp('(?:^|; )' + name + '=([^;]*)')
        )
        return match ? decodeURIComponent(match[1]) : null
      }
      try {
        var t = readCookie('myxtrading_theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#faf7f1' : '#060504')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    })()
  </script>
