<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Miyar Trading — Invest & Trade Stablecoins</title>
    <meta
      name="description"
      content="Miyar Trading is a secure platform to invest in stablecoins, track live crypto market prices, and earn three-level referral rewards — on web, Android and iOS."
    />
    <meta
      name="keywords"
      content="Miyar Trading, stablecoin investment, crypto investing app, invest stablecoins, crypto referral rewards, live crypto prices, USDT investment"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Miyar Trading" />
    <meta name="publisher" content="Miyar Trading" />
    <meta name="application-name" content="Miyar Trading" />
    <meta name="theme-color" content="#0a0805" />
    <meta name="color-scheme" content="dark" />
    <!-- canonical is set at runtime (Seo.jsx) until a public domain is chosen -->

    <!-- Icons / PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Miyar Trading" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miyar Trading" />
    <meta property="og:title" content="Miyar Trading — Invest & Trade Stablecoins" />
    <meta
      property="og:description"
      content="Invest in stablecoins, track live market prices, and earn three-level referral rewards in one secure mobile-friendly app."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <!-- TODO: add <meta property="og:url"> and switch og:image/twitter:image to an absolute URL once the domain is live. -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Miyar Trading — Invest & Trade Stablecoins" />
    <meta
      name="twitter:description"
      content="Invest in stablecoins, track live market prices, and earn three-level referral rewards in one secure app."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- Structured data (SEO + GEO: helps search and AI answer engines) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Miyar Trading",
            "alternateName": "Miyartrading",
            "description": "Miyar Trading is a platform to invest in stablecoins, track live crypto prices, and earn referral rewards.",
            "logo": "/icons/icon-512.png",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "name": "Miyar Trading",
            "description": "Invest in stablecoins, track live crypto market prices, and earn referral rewards.",
            "inLanguage": ["en", "ar"]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Miyar Trading",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web, Android, iOS",
            "description": "Mobile-friendly app for stablecoin investing, live market tracking and referral rewards.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Miyar Trading?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Miyar Trading is a platform where you can invest in stablecoins, follow live market prices, and earn rewards through a three-level referral program."
                }
              },
              {
                "@type": "Question",
                "name": "Which assets can I invest in on Miyar Trading?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can invest in the stablecoins and digital assets listed by the platform administration, such as USDT."
                }
              },
              {
                "@type": "Question",
                "name": "How do referral rewards work on Miyar Trading?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "When you invite friends you can earn commissions across three referral levels, credited to your account."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Miyar Trading — Invest in stablecoins and earn rewards</h1>
      <p>
        Miyar Trading lets you invest in stablecoins such as USDT, track live crypto market prices,
        and earn three-level referral rewards. Please enable JavaScript to use the app.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
