# ---------------------------------------------------------------------------
# Miyar Trading — host nginx vhosts (TLS termination with certbot certs)
#
# Install on the server:
#   sudo cp deploy/nginx/miyartrading.conf /etc/nginx/sites-available/miyartrading.conf
#   sudo ln -sf /etc/nginx/sites-available/miyartrading.conf /etc/nginx/sites-enabled/miyartrading.conf
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare (recommended): add these to your Cloudflare dashboard —
#   * Move the repository to Cloudflare (orange-cloud proxy) via your registrar.
#   * SSL/TLS mode: Full (strict) — Cloudflare terminates TLS at the edge and the
#     origin still uses the certbot certificate below.
#   * Real visitor IP: install the Cloudflare real-IP rules so $remote_addr and
#     X-Forwarded-For reflect the visitor, not Cloudflare:
#       sudo cp deploy/nginx/cloudflare-realip.conf /etc/nginx/conf.d/cloudflare.conf
#     (this file contains only http/server-context directives, so it applies to
#      every vhost; keep its ranges refreshed from https://www.cloudflare.com/ips-v4)
#   * Recommended security: Security -> WAF (Managed Rules ON), Bot Fight Mode,
#     and a rate-limiting rule on /api/auth/* and /api/withdraw/*.
#
# Certificates (first run — cert name becomes "miyartrading.com"):
#   sudo certbot certonly --nginx \
#     -d miyartrading.com -d www.miyartrading.com \
#     -d api.miyartrading.com -d payram.miyartrading.com
#
# Compose maps (see docker-compose.yml / docker-compose.payram.yml):
#   main   -> 127.0.0.1:8080   (React app; also proxies /api to the API)
#   api    -> 127.0.0.1:8000   (Django / gunicorn)
#   payram -> 127.0.0.1:8081   (PayRam dashboard)
# Adjust the ports here if you changed HTTP_PORT/API_HOST_PORT/PAYRAM_HTTP_PORT.
# ---------------------------------------------------------------------------

# ---- HTTP: ACME challenges + permanent redirect to HTTPS ------------------
server {
    listen 80;
    listen [::]:80;
    server_name miyartrading.com www.miyartrading.com api.miyartrading.com payram.miyartrading.com;

    # Only Cloudflare may reach the origin directly (protects the ACME/redirect
    # listener and hides it from scanners). Requires cloudflare-realip.conf.
    include /etc/nginx/conf.d/cloudflare.allow;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Frontend: miyartrading.com / www -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name miyartrading.com www.miyartrading.com;

    ssl_certificate     /etc/letsencrypt/live/miyartrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyartrading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Only Cloudflare may reach the origin directly.
    include /etc/nginx/conf.d/cloudflare.allow;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# ---- Backend API: api.miyartrading.com ------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.miyartrading.com;

    ssl_certificate     /etc/letsencrypt/live/miyartrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyartrading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Only Cloudflare may reach the origin directly.
    include /etc/nginx/conf.d/cloudflare.allow;

    client_max_body_size 20m;

    # Django admin / DRF browsable API assets live in the shared volumes that
    # the `main` container serves; proxy them so /admin/ is fully styled.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# ---- PayRam dashboard: payram.miyartrading.com ----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name payram.miyartrading.com;

    ssl_certificate     /etc/letsencrypt/live/miyartrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyartrading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Only Cloudflare may reach the origin directly.
    include /etc/nginx/conf.d/cloudflare.allow;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PayRam dashboard may use websockets / server-sent events.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
