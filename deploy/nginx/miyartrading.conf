# ---------------------------------------------------------------------------
# Miyar Trading — host nginx vhosts (TLS termination with certbot certs)
#
# Install on the server:
#   sudo cp deploy/nginx/miyartrading.conf /etc/nginx/sites-available/miyartrading.conf
#   sudo ln -sf /etc/nginx/sites-available/miyartrading.conf /etc/nginx/sites-enabled/miyartrading.conf
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates (first run — cert name becomes "miyartrading.com"):
#   sudo certbot certonly --nginx \
#     -d miyartrading.com -d www.miyartrading.com \
#     -d api.miyartrading.com -d payram.miyartrading.com
#
# Compose maps (see docker-compose.yml / docker-compose.payram.yml):
#   main   -> 127.0.0.1:8080   (React app; also proxies /api to the API)
#   api    -> 127.0.0.1:8000   (Django / gunicorn)
#   payram -> 127.0.0.1:8081   (PayRam dashboard)
# Adjust the ports here if you changed HTTP_PORT/API_HOST_PORT/PAYRAM_HTTP_PORT.
# ---------------------------------------------------------------------------

# ---- HTTP: ACME challenges + permanent redirect to HTTPS ------------------
server {
    listen 80;
    listen [::]:80;
    server_name miyartrading.com www.miyartrading.com api.miyartrading.com payram.miyartrading.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Frontend: miyartrading.com / www -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name miyartrading.com www.miyartrading.com;

    ssl_certificate     /etc/letsencrypt/live/miyartrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyartrading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# ---- Backend API: api.miyartrading.com ------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.miyartrading.com;

    ssl_certificate     /etc/letsencrypt/live/miyartrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyartrading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# ---- PayRam dashboard: payram.miyartrading.com ----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name payram.miyartrading.com;

    ssl_certificate     /etc/letsencrypt/live/miyartrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyartrading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PayRam dashboard may use websockets / server-sent events.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
